on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release And Upload assets

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        go_version: [ 'stable' ]
        node_version: [ '22' ]
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache
            ~/go/pkg/mod
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: ${{ runner.os }}-build-

      - name: Get version
        id: get_version
        run: |
          TAG=$(basename ${GITHUB_REF})
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-config.yml
          version: ${{ steps.get_version.outputs.TAG }}
          tag: ${{ steps.get_version.outputs.TAG }}
          disable-releaser: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}
          cache: false

      - name: Make Build
        id: make_build
        run: |
         make all -s && ls build
        env:
          VERSION: ${{ steps.get_version.outputs.TAG }}

      - name: Clean up any existing release for this tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_version.outputs.TAG }}"
          gh api "repos/${{ github.repository }}/releases?per_page=100" --jq \
            ".[] | select(.tag_name == \"${TAG}\") | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/${{ github.repository }}/releases/${id}" && echo "Deleted existing release ${id} for ${TAG}"
            done

      - name: Release Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: false
          prerelease: ${{ !endsWith(steps.get_version.outputs.TAG, '-stable') }}
          make_latest: ${{ endsWith(steps.get_version.outputs.TAG, '-stable') }}
          name: ${{ steps.get_version.outputs.TAG }}
          body: ${{ steps.create_release.outputs.body }}
          files: |
            build/*.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
